# Y copies the current link URL, even when ELinks is launched directly.
# ELinks shell-quotes %c itself; do not add quotes around the placeholder.
set document.uri_passing.clipboard.command = "printf %s %c | \"$HOME/.config/elinks/clipboard\" copy"
bind "main" "Y" = "link-external-command"

# Native text selection uses ELinks' cursor, not link-wise navigation.
# Move to the first character, v, move to the last character, v, y; v clears.
# Selections are rectangular (select single words on one line for translation).
bind "main" "v" = "mark-clipboard"
bind "main" "H" = "move-cursor-left"
bind "main" "J" = "move-cursor-down"
bind "main" "K" = "move-cursor-up"
bind "main" "L" = "move-cursor-right"
bind "main" "Left" = "move-cursor-left"
bind "main" "Down" = "move-cursor-down"
bind "main" "Up" = "move-cursor-up"
bind "main" "Right" = "move-cursor-right"
bind "main" "y" = "copy-clipboard"

# The clipboard launcher supplies a private write pipe at fd 9 and forwards it
# to the OS clipboard. No daemon, persistent FIFO or temporary clipboard file.
# The Zsh elinks function, RSS and Neovim Zeal all use this launcher by default.
# Other integrations can run python3 ~/.config/elinks/clipboard open [URL].
# Plain elinks still copies internally if this descriptor is not available.
set ui.clipboard.filename = "/dev/fd/9"
set ui.clipboard.remove_leading_spaces = 1
set ui.clipboard.remove_trailing_spaces = 1
